apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: xp-0821-guestbook-prod
  annotations:
    kargo.akuity.io/authorized-stage: "xp-0821-guestbook:prod"
spec:
  project: default
  source:
    repoURL: https://github.com/hanxiaop/guestbook.git
    targetRevision: main
    path: xp-0821/prod
  destination:
    name: xp-0821-cluster
    namespace: xp-0821-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
