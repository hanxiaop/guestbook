apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: x08212-kargo-bootstrap
spec:
  project: default
  source:
    repoURL: https://github.com/hanxiaop/guestbook.git
    targetRevision: main
    path: x08212/bootstrap/kargo
  destination:
    name: x08212-kargo-ctl
    namespace: x08212-guestbook
  syncPolicy:
    automated:
      prune: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
