apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: x08212-guestbook-prod
  annotations:
    kargo.akuity.io/authorized-stage: "x08212-guestbook:prod"
spec:
  project: default
  source:
    repoURL: https://github.com/hanxiaop/guestbook.git
    targetRevision: main
    path: x08212/prod
  destination:
    name: x08212-cluster
    namespace: x08212-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
