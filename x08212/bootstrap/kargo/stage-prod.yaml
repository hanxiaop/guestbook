apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: x08212-guestbook
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  shard: x08212-agent
  requestedFreight:
    - origin:
        kind: Warehouse
        name: guestbook
      sources:
        stages: [staging]
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: https://github.com/hanxiaop/guestbook.git
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          config:
            path: ./repo/x08212/prod/deployment.yaml
            updates:
              - key: spec.template.spec.containers.0.image
                value: ${{ imageFrom("ghcr.io/akuity/guestbook").RepoURL }}:${{ imageFrom("ghcr.io/akuity/guestbook").Tag }}
        - uses: git-commit
          config:
            path: ./repo
            message: Promote guestbook ${{ imageFrom("ghcr.io/akuity/guestbook").Tag }} to prod
        - uses: git-push
          as: push
          config:
            path: ./repo
        - uses: argocd-update
          config:
            apps:
              - name: x08212-guestbook-prod
                sources:
                  - repoURL: https://github.com/hanxiaop/guestbook.git
                    desiredRevision: ${{ outputs.push.commit }}
